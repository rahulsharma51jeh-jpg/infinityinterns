<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="AICTE">
  <defs>
    <path id="aicteTop" d="M 60,60 m -47,0 a 47,47 0 1 1 94,0"/>
    <path id="aicteBottom" d="M 60,60 m -41,0 a 41,41 0 1 0 82,0"/>
  </defs>

  <!-- sunburst ring -->
  <g fill="#f2a01d">
    <g id="rays">
      <path d="M60 2 L64 14 L56 14 Z"/>
    </g>
    <g>
      <use href="#rays" transform="rotate(15 60 60)"/><use href="#rays" transform="rotate(30 60 60)"/>
      <use href="#rays" transform="rotate(45 60 60)"/><use href="#rays" transform="rotate(60 60 60)"/>
      <use href="#rays" transform="rotate(75 60 60)"/><use href="#rays" transform="rotate(90 60 60)"/>
      <use href="#rays" transform="rotate(105 60 60)"/><use href="#rays" transform="rotate(120 60 60)"/>
      <use href="#rays" transform="rotate(135 60 60)"/><use href="#rays" transform="rotate(150 60 60)"/>
      <use href="#rays" transform="rotate(165 60 60)"/><use href="#rays" transform="rotate(180 60 60)"/>
      <use href="#rays" transform="rotate(195 60 60)"/><use href="#rays" transform="rotate(210 60 60)"/>
      <use href="#rays" transform="rotate(225 60 60)"/><use href="#rays" transform="rotate(240 60 60)"/>
      <use href="#rays" transform="rotate(255 60 60)"/><use href="#rays" transform="rotate(270 60 60)"/>
      <use href="#rays" transform="rotate(285 60 60)"/><use href="#rays" transform="rotate(300 60 60)"/>
      <use href="#rays" transform="rotate(315 60 60)"/><use href="#rays" transform="rotate(330 60 60)"/>
      <use href="#rays" transform="rotate(345 60 60)"/>
    </g>
  </g>

  <circle cx="60" cy="60" r="47" fill="#f7b731"/>
  <circle cx="60" cy="60" r="39" fill="#ffffff"/>

  <text font-family="Trebuchet MS, sans-serif" font-size="7.6" font-weight="700" fill="#b8121b" letter-spacing="0.4">
    <textPath href="#aicteTop" startOffset="50%" text-anchor="middle">अखिल भारतीय तकनीकी शिक्षा परिषद</textPath>
  </text>
  <text font-family="Trebuchet MS, sans-serif" font-size="6.6" font-weight="700" fill="#b8121b" letter-spacing="0.3">
    <textPath href="#aicteBottom" startOffset="50%" text-anchor="middle">ALL INDIA COUNCIL FOR TECHNICAL EDUCATION</textPath>
  </text>

  <!-- centre emblem: lamp of knowledge over open book -->
  <g transform="translate(60 58)">
    <path d="M0 -16 C 3 -11, 7 -9, 7 -4 C 7 1, 3 3, 0 3 C -3 3, -7 1, -7 -4 C -7 -9, -3 -11, 0 -16 Z" fill="#e2711d"/>
    <path d="M-14 8 L0 4 L14 8 L14 12 L0 8 L-14 12 Z" fill="#12306b"/>
    <path d="M-14 12 L0 8 L14 12 L14 15 L0 11 L-14 15 Z" fill="#1b4a9c"/>
  </g>
  <text x="60" y="98" text-anchor="middle" font-family="Trebuchet MS, sans-serif" font-size="11" font-weight="700" fill="#12306b">AICTE</text>
</svg>
